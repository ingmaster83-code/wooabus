name: 고속버스·시외버스 데이터 갱신

on:
  schedule:
    - cron: '0 19 * * *'  # 매일 새벽 4시 KST (UTC 19:00)
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: pip install requests

      - name: 기존 노선 갱신 + 신규 노선 탐색
        run: python scripts/fetch_express_bus.py --daily

      - name: 페이지 재생성
        run: |
          python scripts/generate_pages.py
          python scripts/generate_express_pages.py

      - name: 변경사항 커밋 & 푸시
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add .
          git diff --staged --quiet || git commit -m "고속버스·시외버스 데이터 자동 갱신 $(date +'%Y-%m-%d')"
          git push
